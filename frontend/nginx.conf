server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page application: every unknown path is handled by the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (docker-compose service name "backend").
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running simulations and AI answers need a generous timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /docs  { proxy_pass http://backend:8000/docs; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
