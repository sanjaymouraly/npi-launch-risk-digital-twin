services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-npi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npi}
      POSTGRES_DB: ${POSTGRES_DB:-npi}
    volumes:
      - npi_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npi} -d ${POSTGRES_DB:-npi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      # The build context is the repository root: the demo programs in data/
      # are part of the API image so it can seed itself on an empty database.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-npi}:${POSTGRES_PASSWORD:-npi}@db:5432/${POSTGRES_DB:-npi}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: production
      SEED_DEMO_ON_STARTUP: ${SEED_DEMO_ON_STARTUP:-false}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AI_ACTIVE_PROVIDER: ${AI_ACTIVE_PROVIDER:-offline}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-25}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  npi_pgdata:
